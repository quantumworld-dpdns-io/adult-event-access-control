services:
  postgres:
    build:
      context: ../src/db
      dockerfile: Dockerfile
    container_name: aev-postgres
    environment:
      POSTGRES_USER: aev
      POSTGRES_PASSWORD: aev_secret
      POSTGRES_DB: aev_events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aev -d aev_events"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    container_name: aev-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: aev
      DB_PASSWORD: aev_secret
      DB_NAME: aev_events
      JWT_SECRET: change-me-in-production
      WORLD_ID_APP_ID: app_staging
      WORLD_ID_ACTION: aev-age-verification
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  julia-analytics:
    build:
      context: ../src/analytics
      dockerfile: Dockerfile
    container_name: aev-analytics
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: aev
      DB_PASSWORD: aev_secret
      DB_NAME: aev_events
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    container_name: aev-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

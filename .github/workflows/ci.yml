name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod tidy
      - run: go build ./cmd/server
      - run: go vet ./...

  zk-prover:
    name: Rust ZK Prover
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zk-prover
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo check
      - run: cargo build --release --bin zk-prover

  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  julia-analytics:
    name: Julia Analytics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - run: julia -e 'import Pkg; Pkg.instantiate()'
      - run: julia -e 'include("src/fraud_detection.jl"); println("OK")'

  solidity:
    name: Solidity Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/zk-prover/solidity
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build

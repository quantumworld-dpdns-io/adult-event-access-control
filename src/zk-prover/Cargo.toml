[package]
name = "zk-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zk-prover"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = "26"
thiserror = "2"
